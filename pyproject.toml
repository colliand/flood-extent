[project]
name = "flood-extent"
version = "0.1.0"
description = "Open floodwater from Sentinel-1 radar by change detection, checked against FEMA flood zones. One config file per event."
requires-python = "==3.13.*"
dependencies = [
    "requests==2.34.2",
    "numpy==2.5.3",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
    "rasterio==1.5.1",
    "scipy==1.16.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
exclude-newer = "2026-10-09T00:00:00Z"
